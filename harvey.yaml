persona:
  name: "Harvey"
  company: "Your Company"
  role: "Business Development"
  email: "harvey@yourcompany.com"
  linkedin: "linkedin.com/in/harvey-yourcompany"
  tone: "professional, consultative, confident"

product:
  name: "Your Product"
  description: "Describe what your product does and who it's for"
  pricing: "Starting at $X/mo"
  key_benefits:
    - "Benefit 1"
    - "Benefit 2"
    - "Benefit 3"
  objection_responses:
    "too expensive": "I understand budget is important. Most of our clients see ROI within 30 days..."
    "already have a solution": "That makes sense. Curious — what's the one thing you wish it did better?"
    "not interested": "No worries at all. Mind if I ask what your current approach looks like?"
  offer:
    primary: ""                    # Main offer (e.g., "Monthly subscription starting at $99/mo")
    entry: ""                      # Low-commitment entry (e.g., "14-day free trial", "Free audit")
    goal: "book_call"              # Goal of outreach: book_call, start_trial, get_reply
    booking_method: "calendar_link" # calendar_link, suggest_times, ask_preference
    booking_url: ""                # Calendar link URL (if using calendar_link method)
    meeting_duration: "15 minutes" # How long the call is
    meeting_owner: ""              # Who takes the meeting (name or role)

icp:
  industries:
    - "SaaS"
    - "Marketing Agency"
  company_size: "10-200 employees"
  titles:
    - "VP Marketing"
    - "Head of Growth"
    - "CMO"
    - "Director of Marketing"
  geography:
    - "United States"
  # Roles that signal a company is in-market RIGHT NOW (a company hiring a
  # "Head of Growth" is shopping for growth tooling). Used for careers-page
  # scanning and job-board discovery. Empty = fall back to titles above.
  hiring_signals: []
  # Old online shops (harvey/footprints.py), off while both are empty: niches
  # for Scout to combine with footprint searches like "Powered by osCommerce"
  # (and each geography entry), and searches of your own, run as written.
  # Needs the SITE_PLATFORM signal confirmed.
  legacy_niches: []
  footprint_queries: []

channels:
  email:
    enabled: true
    provider: "gmail"          # gmail (recommended) | microsoft | smtp | instantly
    max_daily_sends: 50
    require_approval: true      # native: review in Outbox; Instantly: sending held
    # link_domains: ["mainsite.com"]   # your own sites besides the sending
    #                                  # domain and booking link; on autopilot,
    #                                  # an email linking elsewhere waits for you
    send_to_risky: false        # also send to catch-all domains (off = safest)
    max_bounce_rate: 0.05       # pause all sending if bounces exceed this
    # New sending domain? Set start_date to the day your warmup service went
    # on: no cold email for min_days, then the cold cap climbs from
    # start_sends by daily_increase a day up to max_daily_sends. Replies are
    # never held. Gmail/Microsoft/SMTP only (Instantly has its own warmup).
    # Check readiness any time with `harvey warmup`.
    # We recommend TrulyInbox for warmup: https://trulyinbox.com/?via=harvey
    # Connect it (`harvey trulyinbox connect`) and `harvey warmup` reads
    # whether this mailbox is actually warmed.
    warmup:
      start_date: ""            # YYYY-MM-DD; blank = no ramp
      min_days: 14
      start_sends: 5
      daily_increase: 3
      dkim_selector: ""         # only if your provider uses an unusual one
    # Send cold email only in office hours in each recipient's own time zone,
    # worked out from the company's location or the country Precleared finds.
    # Anyone Harvey can't place gets the window in usage.quiet_hours.timezone.
    # Follow-ups move into the window; replies are never held. Quiet hours
    # then stop prospecting and writing, not mail that's due.
    # Gmail/Microsoft/SMTP only. Remove the # marks to switch it on.
    # send_window:
    #   start: "08:00"
    #   end: "17:00"
    #   weekdays_only: true      # Monday to Friday, in every country
    #   recipient_timezone: true  # false: one zone for everyone (quiet_hours.timezone)
    # Each segment's share of the day's first emails (follow-ups and replies
    # always go first; a segment with nothing due leaves its share to the
    # others). Custom (old shop software) ramps up from 15% while its bounces
    # stay low; see the Mailboxes tab. Blank: first emails in queue order.
    # segment_weights: {custom: 0.40, wordpress: 0.35, shopify: 0.25}
    # See a segment's first emails before autopilot sends them: a few wait in
    # the Outbox as samples, and approving one lets that segment go on its own.
    # review_segments: [wordpress, custom]
    # Follow up with people who gave their email in your website's live chat
    # (harvey/inbound.py). Needs ERP_SUPABASE_URL and ERP_SUPABASE_KEY in .env.
    # `harvey inbound run` works whether or not this is enabled; enabled adds a
    # background poll, quiet hours included, that reaches a new lead within the
    # hour of its chat ending. Remove the # marks to switch it on.
    # inbound:
    #   enabled: true
    #   idle_minutes: 30         # a chat counts as finished once it's this quiet
    #   poll_minutes: 5
    #   rep_active_days: 14      # leave a chat alone this long after a person on your side wrote
    #   autopilot: false         # false: every draft waits in the Outbox for you. true: they send
    #                            # on their own, whatever require_approval says (written
    #                            # estimates still wait for you, always)
    #   # The only amounts a written estimate may name, each with its currency. Any other
    #   # figure refuses the estimate, and so does an empty list: that lead gets an ordinary
    #   # email asking for the one missing detail instead. These two are placeholders. Put
    #   # your real ones in harvey.local.yaml, never in this tracked file.
    #   price_list: ["$1,111", "$2,222"]
  linkedin:
    enabled: false             # explicit opt-in; the switch on the dashboard's LinkedIn tab overrides this
    max_daily_connections: 15  # connection invites a day (75 a week: max_weekly_invites)
    max_daily_messages: 25     # first messages, follow-ups and replies a day
    autopilot: false           # drafts wait on the dashboard's LinkedIn tab until true
    # Harvey acts on LinkedIn only in these hours, with 60-240 s between actions
    # and at most 12 an hour. Connect on the dashboard's LinkedIn tab, or
    # `harvey linkedin login`, signs the profile in.
    # hours: {start: "10:00", end: "19:00", timezone: "Asia/Kolkata", weekdays_only: true}
    # WhatsApp through WhatsApp Web, only to people who gave you their number
    # themselves (`harvey whatsapp add`). Automating WhatsApp breaks its terms and
    # can get the number banned: use a separate number you can afford to lose, and
    # keep these limits low. Connect on the dashboard's WhatsApp tab, or `harvey
    # whatsapp login`, links it by QR code, and the switch on that tab turns it on
    # and off (it overrides `enabled` here). To set anything else, remove the #
    # marks. Put the real number in harvey.local.yaml.
    # whatsapp:
    #   enabled: true
    #   autopilot: false             # drafts wait on the dashboard's WhatsApp tab until true
    #   number: "+15555550100"       # the linked number, shown on the dashboard
    #   max_daily_first_messages_new: 5   # first messages a day for new_number_days after linking
    #   max_daily_first_messages: 10      # ...and after that
    #   new_number_days: 14
    #   max_daily_messages: 30       # first messages, follow-ups and replies
    #   max_messages_per_hour: 8
    #   min_delay_seconds: 45        # between actions, with longer breaks every few
    #   max_delay_seconds: 180
    #   follow_up_min_days: 3        # one follow-up 3-5 days later if silent
    #   follow_up_max_days: 5
    #   max_unanswered: 3
    #   do_not_contact: []           # numbers never to message, each with its + country code
    #   # Goes by the recipient's own clock when known; anyone Harvey can't place uses this.
    #   hours: {start: "10:00", end: "19:00", timezone: "Asia/Kolkata", weekdays_only: true}

usage:
  max_daily_claude_percent: 80
  heartbeat_interval_minutes: 15
  quiet_hours:
    start: "22:00"
    end: "07:00"
    timezone: "America/New_York"

# Optional: check each new recipient with Precleared (precleared.dev) before
# the first cold email: may cold marketing email go to this address under UK
# PECR, US CAN-SPAM, Canada's CASL, Germany's UWG and France's rules? Any other
# answer holds the email back, with the reason in the Outbox. One check per
# address; 10 a day free without a key, 25 with a free key (PRECLEARED_API_KEY
# in .env). Applies to the native providers (gmail, microsoft, smtp). If all
# your prospects are in one country, set prospect_country: Precleared uses it
# only when it can't tell the country from the address, company records or the
# company's website.
compliance:
  # Added under every cold email (never replies). US law (CAN-SPAM) requires a
  # postal address you receive mail at: a street address, PO box or virtual
  # mailbox. Until it's set, cold email still sends, with a warning.
  postal_address: ""
  # Keep wording Harvey recognises as an opt-out ("no thanks", "unsubscribe").
  opt_out_line: 'Not interested? Reply "no thanks" and I won''t email again.'
  # Never email these, cold or in reply: competitors, your existing customers,
  # anyone under a legal hold. An entry is an address or a domain, and a domain
  # covers its subdomains ("acme.example" also blocks "mail.acme.example", but
  # not "notacme.example"). Checked by the gate at send time, so it holds even
  # for an email you already approved in the Outbox, and picked up by a running
  # Harvey at once. If you trained Harvey, set it in harvey.local.yaml instead:
  # that file wins.
  do_not_contact: []
  #   - "competitor.example"
  #   - "jane@acme.example"
  precleared:
    enabled: false
    sender_country: ""          # GB or US: where your business is based
    address_source: "unknown"   # published | bought | scraped | given | unknown
    prospect_country: ""        # optional, e.g. US if all your prospects are in one country
    # Harvey also tells Precleared the recipient's country when the company's
    # location makes it certain, and the company's and person's names when
    # it has them (see docs/precleared.md).
    # Optional: recipients Harvey is sure are in one of these countries (from
    # the company's location, never prospect_country) are not checked, so no
    # check is spent on them, and their email is clear to send. Unset or
    # empty, everyone is checked.
    # skip_countries: ["US"]

# Optional: your own rules for the emails Harvey drafts (length, structure,
# what to say about the product, links, subject lines, sign-off), as a
# markdown file. When set they replace the built-in shape (email 1 under 75
# words, an observation and a question, no pitch). The send gate still holds
# every email to 220 words and one link. skills/email_rules.md is gitignored.
# writer:
#   email_rules: "skills/email_rules.md"
